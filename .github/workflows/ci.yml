name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and build Linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Generate embedded resources
        run: go generate ./...
      - name: Check documentation
        run: make lint-docs
      - name: Vet
        run: go vet -tags stdjson ./...
      - name: Test
        run: go test -tags stdjson ./...
      - name: Build Linux amd64
        run: make build GOOS=linux GOARCH=amd64

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go generate ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          args: --build-tags=stdjson

  vulnerability:
    name: Vulnerability check
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=stdjson
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck -C . -format text ./...

  integration:
    name: Docker integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: bash ./scripts/run-integration-tests.sh
